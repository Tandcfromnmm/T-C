<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Availability Directory</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .filter-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .result-card { margin-top: 20px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa; }
        .alert { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Find Doctor OP Timings & Availability</h2>
    
    <div class="filter-group">
        <label for="branchSelect">Select Branch:</label>
        <select id="branchSelect" onchange="filterHospitals()">
            <option value="">-- Choose Branch --</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="doctorSelect">Select Doctor:</label>
        <select id="doctorSelect" onchange="displayDoctorDetails()">
            <option value="">-- Choose Doctor --</option>
        </select>
    </div>

    <div id="doctorDetails" class="result-card" style="display: none;">
        <h3>Doctor Information</h3>
        <p><strong>Hospital:</strong> <span id="resHospital"></span></p>
        <p><strong>Department:</strong> <span id="resDept"></span> | <strong>Unit:</strong> <span id="resUnit"></span></p>
        <p><strong>OP Timings:</strong> <span id="resTimings"></span></p>
        <p><strong>OP Fee:</strong> <span id="resFee"></span></p>
        <p><strong>Updates / Leave Status:</strong> <span id="resLeave" class="alert"></span></p>
    </div>
</div>

<script>
    let doctorData = [];

    // Fetch the JSON data generated from your Excel sheet
    fetch('doctors.json')
        .then(response => response.json())
        .then(data => {
            doctorData = data;
            populateBranches();
        });

    function populateBranches() {
        const branches = [...new Set(doctorData.map(d => d.Branch))];
        const branchSelect = document.getElementById('branchSelect');
        branches.forEach(branch => {
            let opt = document.createElement('option');
            opt.value = branch;
            opt.textContent = branch;
            branchSelect.appendChild(opt);
        });
    }

    function filterHospitals() {
        const selectedBranch = document.getElementById('branchSelect').value;
        const doctorSelect = document.getElementById('doctorSelect');
        doctorSelect.innerHTML = '<option value="">-- Choose Doctor --</option>';
        document.getElementById('doctorDetails').style.display = 'none';

        const filteredDoctors = doctorData.filter(d => d.Branch === selectedBranch);
        filteredDoctors.forEach((doc, index) => {
            let opt = document.createElement('option');
            opt.value = index; // using index to reference data item easily
            opt.textContent = `${doc["Doctor Name"]} (${doc.Department})`;
            doctorSelect.appendChild(opt);
        });
    }

    function displayDoctorDetails() {
        const index = document.getElementById('doctorSelect').value;
        const detailsDiv = document.getElementById('doctorDetails');

        if (index === "") {
            detailsDiv.style.display = 'none';
            return;
        }

        // Find the selected doctor based on branch and selection
        const selectedBranch = document.getElementById('branchSelect').value;
        const filteredDoctors = doctorData.filter(d => d.Branch === selectedBranch);
        const doc = filteredDoctors[index];

        document.getElementById('resHospital').textContent = doc["Hospital Name"];
        document.getElementById('resDept').textContent = doc["Department"];
        document.getElementById('resUnit').textContent = doc["Unit"];
        document.getElementById('resTimings').textContent = doc["OP Timings"];
        document.getElementById('resFee').textContent = doc["OP Fee"];
        document.getElementById('resLeave').textContent = doc["Leave / Timing Updates"];

        detailsDiv.style.display = 'block';
    }
</script>

</body>
</html>
