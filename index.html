<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctor - CARE Hospitals</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #16223f;
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --border-color: #1e293b;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Branding Header */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-image {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        /* Search Bar & Auto-Suggest Style */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px 14px 44px;
            font-size: 16px;
            background: var(--card-bg);
            border: 1px solid #2d3748;
            border-radius: var(--radius);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* Suggestion Dropdown List */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid #2d3748;
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
            color: var(--text-main);
            transition: background 0.15s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        /* Results List Style */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .doctor-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid #1e293b;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .doctor-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .doctor-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .doctor-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
        }

        .hospital-badge {
            font-size: 12px;
            font-weight: 500;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .info-item strong {
            color: var(--text-main);
        }

        .update-banner {
            background: rgba(245, 158, 11, 0.15);
            border-left: 4px solid #f59e0b;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #fbbf24;
            margin-top: 10px;
        }

        /* Super Classic Apple-Style Container Card with Title Header Inside */
        .stare-container-card {
            background: var(--card-bg);
            border: 1px solid #2d3748;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
        }

        .stare-container-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }

        .stare-container-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .stare-compact-banner {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(124, 58, 237, 0.15) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stare-compact-banner:hover {
            transform: translateY(-1px);
            border-color: #3b82f6;
        }

        .star-compact-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .star-icon-box {
            width: 36px;
            height: 36px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60a5fa;
            flex-shrink: 0;
        }

        .star-compact-info h4 {
            margin: 0 0 2px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .star-compact-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .star-compact-action {
            font-size: 13px;
            font-weight: 600;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Floating Star/Flag Action Button */
        .floating-star-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            z-index: 1500;
            border: none;
            transition: transform 0.2s ease;
        }

        .floating-star-btn:hover {
            transform: scale(1.08);
        }

        .no-results {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            padding: 20px;
        }

        /* Modal Overlay for Detailed View */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
            transform: translateY(20px);
            transition: transform 0.25s ease;
            position: relative;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e293b;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .modal-close:hover {
            background: #2d3748;
            color: var(--text-main);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #60a5fa;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-details-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-size: 15px;
            background: #0b132b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        .modal-detail-row {
            display: flex;
            justify-content: space-between;
        }

        .modal-detail-row span:first-child {
            color: var(--text-secondary);
        }

        .modal-detail-row span:last-child {
            font-weight: 600;
            color: var(--text-main);
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Branding Header with static logo image -->
    <div class="brand-header">
        <img src="images-removebg-preview.png" alt="Logo" class="logo-image">
        <div class="brand-title">Find Doctor</div>
    </div>
    
    <!-- Search Bar & Auto-Suggest Box -->
    <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search doctor, specialty, or branch..." oninput="handleSearchInput()" autocomplete="off">
        <div id="suggestionsList" class="suggestions-list"></div>
    </div>

    <!-- Dynamic Results Container -->
    <div id="resultsContainer" class="results-container">
        <!-- Super Classic Stare Doctors Container Card -->
        <div id="defaultStareContainer" class="stare-container-card">
            <div class="stare-container-header">
                <span class="stare-container-title">Stare Doctors</span>
                <span style="font-size: 13px; color: var(--text-secondary);">Popular</span>
            </div>
            <div class="stare-compact-banner" onclick="openStarredModal()">
                <div class="star-compact-left">
                    <div class="star-icon-box">⭐</div>
                    <div class="star-compact-info">
                        <h4 id="starredDocName">Loading Featured Doctor...</h4>
                        <p id="starredDocSub">Specialty • Branch</p>
                    </div>
                </div>
                <div class="star-compact-action">View Info</div>
            </div>
        </div>
    </div>
</div>

<!-- Floating Star/Flag Action Button -->
<button id="floatingStarBtn" class="floating-star-btn" onclick="openStarredModal()" title="View Stare Doctor">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>
</button>

<!-- Detailed Modal Overlay -->
<div id="doctorModal" class="modal-overlay" onclick="closeModalOnBg(event)">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 id="modalDoctorName" class="modal-title"></h2>
        <div id="modalDeptUnit" class="modal-subtitle"></div>
        
        <div class="modal-details-grid">
            <div class="modal-detail-row">
                <span>Branch Location:</span>
                <span id="modalBranch"></span>
            </div>
            <div class="modal-detail-row">
                <span>Hospital:</span>
                <span id="modalHospital"></span>
            </div>
            <div class="modal-detail-row">
                <span>OP Fee:</span>
                <span id="modalFee"></span>
            </div>
            <div class="modal-detail-row" style="flex-direction: column; gap: 4px;">
                <span>OP Timings:</span>
                <span id="modalTimings" style="text-align: left;"></span>
            </div>
        </div>

        <div id="modalUpdateContainer"></div>
    </div>
</div>

<script>
    let doctorData = [];
    let featuredDoctor = null;

    // Fetch JSON data generated from Excel sheet
    fetch('doctors.json')
        .then(response => response.json())
        .then(data => {
            doctorData = data;
            if (doctorData.length > 0) {
                featuredDoctor = doctorData[0];
                updateFeaturedCardUI();
            }
        })
        .catch(error => {
            console.error('Error loading doctor data:', error);
            document.getElementById('resultsContainer').innerHTML = `<div class="no-results">Unable to load doctor database. Please check doctors.json file.</div>`;
        });

    function updateFeaturedCardUI() {
        if (!featuredDoctor) return;
        document.getElementById('starredDocName').textContent = featuredDoctor["Doctor Name"] || 'N/A';
        document.getElementById('starredDocSub').textContent = `${featuredDoctor["Department"] || 'Specialty'} • ${featuredDoctor["Branch"] || 'Branch'}`;
    }

    function handleSearchInput() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const suggestionsBox = document.getElementById('suggestionsList');
        const container = document.getElementById('resultsContainer');
        const floatingBtn = document.getElementById('floatingStarBtn');
        
        if (query === "") {
            suggestionsBox.style.display = 'none';
            // Restore full Stare Doctors container card when search is cleared
            container.innerHTML = `
                <div id="defaultStareContainer" class="stare-container-card">
                    <div class="stare-container-header">
                        <span class="stare-container-title">Stare Doctors</span>
                        <span style="font-size: 13px; color: var(--text-secondary);">Featured</span>
                    </div>
                    <div class="stare-compact-banner" onclick="openStarredModal()">
                        <div class="star-compact-left">
                            <div class="star-icon-box">⭐</div>
                            <div class="star-compact-info">
                                <h4 id="starredDocName"></h4>
                                <p id="starredDocSub"></p>
                            </div>
                        </div>
                        <div class="star-compact-action">View Info</div>
                    </div>
                </div>
            `;
            updateFeaturedCardUI();
            floatingBtn.style.display = 'none';
            return;
        }

        const filtered = doctorData.filter(doc => {
            return Object.values(doc).some(val => 
                String(val).toLowerCase().includes(query)
            );
        });

        showSuggestions(filtered);
        renderDoctors(filtered);

        // Hide Stare Doctors container, show floating icon when search results are active
        floatingBtn.style.display = 'flex';
    }

    function showSuggestions(doctors) {
        const suggestionsBox = document.getElementById('suggestionsList');
        suggestionsBox.innerHTML = '';

        if (doctors.length === 0) {
            suggestionsBox.style.display = 'none';
            return;
        }

        const topMatches = doctors.slice(0, 5);
        topMatches.forEach(doc => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.innerHTML = `<strong>${doc["Doctor Name"]}</strong> <span style="color:var(--text-secondary); font-size:13px;">(${doc["Department"]} - ${doc["Branch"]})</span>`;
            
            item.onclick = function() {
                document.getElementById('searchInput').value = doc["Doctor Name"];
                suggestionsBox.style.display = 'none';
                renderDoctors([doc]);
                document.getElementById('floatingStarBtn').style.display = 'flex';
            };
            
            suggestionsBox.appendChild(item);
        });

        suggestionsBox.style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-box-wrapper')) {
            document.getElementById('suggestionsList').style.display = 'none';
        }
    });

    function renderDoctors(doctors) {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        if (doctors.length === 0) {
            container.innerHTML = `<div class="no-results">No doctors found matching your search.</div>`;
            return;
        }

        doctors.forEach((doc) => {
            const card = document.createElement('div');
            card.className = 'doctor-card';
            card.onclick = () => openModal(doc);

            card.innerHTML = `
                <div class="doctor-header">
                    <div>
                        <h3 class="doctor-name">${doc["Doctor Name"] || 'N/A'}</h3>
                        <span style="font-size: 13px; color: var(--text-secondary);">${doc["Department"] || ''} • Unit: ${doc["Unit"] || 'N/A'}</span>
                    </div>
                    <span class="hospital-badge">${doc["Branch"] || 'CARE'}</span>
                </div>
                <div class="info-grid">
                    <div class="info-item"><strong>Hospital:</strong> ${doc["Hospital Name"] || 'CARE Hospitals'}</div>
                    <div class="info-item"><strong>OP Fee:</strong> ${doc["OP Fee"] || 'N/A'}</div>
                    <div class="info-item" style="grid-column: span 2;"><strong>OP Timings:</strong> ${doc["OP Timings"] || 'N/A'}</div>
                </div>
                ${doc["Leave / Timing Updates"] && doc["Leave / Timing Updates"] !== "Regular Timings" ? `
                    <div class="update-banner">
                        ⚠️ <strong>Notice:</strong> ${doc["Leave / Timing Updates"]}
                    </div>
                ` : ''}
            `;
            container.appendChild(card);
        });
    }

    function openModal(doc) {
        document.getElementById('modalDoctorName').textContent = doc["Doctor Name"] || 'N/A';
        document.getElementById('modalDeptUnit').textContent = `${doc["Department"] || 'Specialty'} • ${doc["Unit"] || 'Unit N/A'}`;
        document.getElementById('modalBranch').textContent = doc["Branch"] || 'N/A';
        document.getElementById('modalHospital').textContent = doc["Hospital Name"] || 'CARE Hospitals';
        document.getElementById('modalFee').textContent = doc["OP Fee"] || 'N/A';
        document.getElementById('modalTimings').textContent = doc["OP Timings"] || 'N/A';

        const updateContainer = document.getElementById('modalUpdateContainer');
        if (doc["Leave / Timing Updates"] && doc["Leave / Timing Updates"] !== "Regular Timings") {
            updateContainer.innerHTML = `
                <div class="update-banner" style="margin-top: 0;">
                    ⚠️ <strong>Notice:</strong> ${doc["Leave / Timing Updates"]}
                </div>
            `;
        } else {
            updateContainer.innerHTML = '';
        }

        document.getElementById('doctorModal').classList.add('active');
    }

    function openStarredModal() {
        if (featuredDoctor) {
            openModal(featuredDoctor);
        }
    }

    function closeModal() {
        document.getElementById('doctorModal').classList.remove('active');
    }

    function closeModalOnBg(event) {
        if (event.target.id === 'doctorModal') {
            closeModal();
        }
    }
</script>

</body>
</html>
